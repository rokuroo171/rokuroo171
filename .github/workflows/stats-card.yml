name: Update README cards
on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 (staggered from streak stats at 03:00)
  push:
    paths:
      - ".github/workflows/stats-card.yml"
  workflow_dispatch:

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=1A1A1A&ring_color=FFB1B4&title_color=F5F6F8&icon_color=E1D5C1&text_color=AEC6CF&border_color=AEC6CF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg
          git commit -m "Update stats card" || exit 0
          # the other card workflow may have committed while this run was queued
          git pull --rebase origin main
          git push
