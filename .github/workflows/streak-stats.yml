name: Update streak stats
on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch: # manual trigger from Actions tab

concurrency: readme-cards

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&hide_border=true&ring=FFB1B4&fire=AEC6CF&currStreakLabel=FFB1B4&sideLabels=AEC6CF&dates=AEC6CF&background=1A1A1A
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          # the other card workflow may have committed while this run was queued
          git pull --rebase origin main
          git push
